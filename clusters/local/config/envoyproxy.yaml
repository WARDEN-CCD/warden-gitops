# kind: expose the gateway as NodePort 30080, which warden-infra/kind/warden.yaml maps to 127.0.0.1:18080.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: warden
  namespace: envoy-gateway-system
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        replicas: 1
      envoyService:
        name: warden-gateway       # stable in-cluster name (k6 load, warden-platform/load)
        type: NodePort
        # kind publishes 18080 on the control-plane node, while Envoy runs on the worker. The default (Local)
        # drops NodePort traffic on nodes without an Envoy pod, so connections from the host hung.
        externalTrafficPolicy: Cluster
        patch:
          type: StrategicMerge
          value:
            spec:
              ports:
                - port: 80
                  nodePort: 30080
