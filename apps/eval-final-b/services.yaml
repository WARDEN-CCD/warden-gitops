# Argo Rollouts rewrites both selectors with the stable/canary pod-template hash.
apiVersion: v1
kind: Service
metadata:
  name: eval-final-b-stable
  namespace: svc-eval-final-b
spec:
  selector:
    app.kubernetes.io/name: eval-final-b
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: eval-final-b-canary
  namespace: svc-eval-final-b
spec:
  selector:
    app.kubernetes.io/name: eval-final-b
  ports:
    - name: http
      port: 80
      targetPort: http
