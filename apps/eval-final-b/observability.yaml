# rollouts-pod-template-hash becomes the Prometheus label rollouts_pod_template_hash, which the
# warden-canary analysis uses to compare canary pods against the SLO.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: eval-final-b
  namespace: svc-eval-final-b
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: eval-final-b
  podTargetLabels:
    - rollouts-pod-template-hash
    - app.kubernetes.io/name
  podMetricsEndpoints:
    - port: http
      path: /actuator/prometheus
      interval: 15s
