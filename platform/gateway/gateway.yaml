# Shared Gateway API entry point (ADR-012). The EnvoyProxy "warden" it references is cluster-specific:
# clusters/<name>/config/envoyproxy.yaml (NodePort on kind, LoadBalancer on AKS).
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: warden
    namespace: envoy-gateway-system
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: warden
  namespace: envoy-gateway-system
spec:
  gatewayClassName: envoy
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              warden.dev/expose: "true"   # only service namespaces created by `warden new` carry this label
