# AppProject for the Crossplane API and backend Applications (hub ADR-029): resources from warden-infra.
# The Azure provider and cluster-scoped provider configuration are allowed only from this source repository.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: warden-infra
  namespace: argocd
spec:
  description: Crossplane APIs, provider packages and compositions from warden-infra
  sourceRepos:
    - https://github.com/WARDEN-CCD/warden-infra.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: crossplane-system
  clusterResourceWhitelist:
    - { group: apiextensions.crossplane.io, kind: CompositeResourceDefinition, name: "*.platform.warden.dev" }
    - { group: apiextensions.crossplane.io, kind: Composition }
    - { group: pkg.crossplane.io,           kind: Function }
    - { group: pkg.crossplane.io,           kind: Provider }
    - { group: azure.m.upbound.io,          kind: ClusterProviderConfig }
    - { group: rbac.authorization.k8s.io,   kind: ClusterRole, name: "crossplane-compose-*" }
  namespaceResourceBlacklist:
    - { group: "*", kind: "*" }   # no namespaced objects: crossplane-system is exempt from image verification
