# Single replica per controller: availability is a stated non-goal (THREAT_MODEL residual risk 1).
admissionController:
  replicas: 1
backgroundController:
  replicas: 1
cleanupController:
  replicas: 1
reportsController:
  replicas: 1
# The kyverno-api subchart renders `labels: {}` on its CRDs when no labels are set; the API server drops the
# empty map, so Argo CD reported 11 CRDs OutOfSync forever. A real label removes the empty map.
kyverno-api:
  labels:
    app.kubernetes.io/part-of: kyverno
