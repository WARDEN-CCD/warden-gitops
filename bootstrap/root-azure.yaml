# Root of the app-of-apps for the AKS cluster (ADR-014). Applied once by `task up:azure` in warden-infra.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/WARDEN_ORG/warden-gitops.git
    targetRevision: main
    path: clusters/azure
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
