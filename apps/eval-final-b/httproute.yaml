# Weights are managed by the Argo Rollouts Gateway API plugin during a rollout (ADR-012).
# Only /api is routed: actuator endpoints (health, prometheus) are reached in-cluster by kubelet and Prometheus,
# never through the gateway.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: eval-final-b
  namespace: svc-eval-final-b
spec:
  parentRefs:
    - name: warden
      namespace: envoy-gateway-system
  hostnames:
    - eval-final-b.warden.localhost
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: eval-final-b-stable
          port: 80
          weight: 100
        - name: eval-final-b-canary
          port: 80
          weight: 0
