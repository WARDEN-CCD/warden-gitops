# Argo Rollouts rewrites both selectors with the stable/canary pod-template hash.
apiVersion: v1
kind: Service
metadata:
  name: members-stable
  namespace: svc-members
spec:
  selector:
    app.kubernetes.io/name: members
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: members-canary
  namespace: svc-members
spec:
  selector:
    app.kubernetes.io/name: members
  ports:
    - name: http
      port: 80
      targetPort: http
