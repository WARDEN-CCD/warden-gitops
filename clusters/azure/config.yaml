# Git-sourced configuration for the AKS cluster. Each repo owns its content (hub DESIGN §8, ADR-001);
# this repo only points at it. Custom resources whose CRDs come from the platform charts are applied with
# SkipDryRunOnMissingResource and retried until those CRDs exist. Each element names its AppProject
# (platform/projects/<project>.yaml, hub ADR-029): one per source repo, so a repo cannot pick or widen its own.
# No CreateNamespace: the namespaces come from the platform charts, and config projects may not write Namespaces.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: config
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - { name: policies,       repo: warden-policy,   path: policies,              namespace: kyverno,              project: warden-policy }
          - { name: crossplane-api,      repo: warden-infra, path: crossplane/base,             namespace: crossplane-system, project: warden-infra }
          - { name: crossplane-database, repo: warden-infra, path: crossplane/overlays/azure,  namespace: crossplane-system, project: warden-infra }
          - { name: observability,  repo: warden-platform, path: observability,         namespace: monitoring,           project: warden-platform }
          - { name: gateway,        repo: warden-gitops,   path: platform/gateway,      namespace: envoy-gateway-system, project: warden-gitops }
          - { name: projects,       repo: warden-gitops,   path: platform/projects,     namespace: argocd,               project: root }
          - { name: load,           repo: warden-platform, path: load,                  namespace: k6-operator-system,   project: warden-platform }
          - { name: azure-config,   repo: warden-gitops,   path: clusters/azure/config, namespace: argocd,               project: warden-gitops }
  template:
    metadata:
      name: "{{ .name }}"
      namespace: argocd
      labels:
        warden.dev/layer: config
    spec:
      project: "{{ .project }}"
      source:
        repoURL: "https://github.com/WARDEN-CCD/{{ .repo }}.git"
        targetRevision: main
        path: "{{ .path }}"
        directory:
          recurse: true
          include: "{*.yaml,*.yml}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{ .namespace }}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - ServerSideApply=true
          - SkipDryRunOnMissingResource=true
        retry:
          limit: 20
          backoff:
            duration: 15s
            factor: 2
            maxDuration: 5m
