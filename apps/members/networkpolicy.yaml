# Default-deny ingress; allow only the gateway (traffic) and Prometheus (metrics), plus same-namespace pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: members
  namespace: svc-members
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: members
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
        - podSelector: {}
      ports:
        - port: http
