# Argo Rollouts rewrites both selectors with the stable/canary pod-template hash.
apiVersion: v1
kind: Service
metadata:
  name: books-stable
  namespace: svc-books
spec:
  selector:
    app.kubernetes.io/name: books
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: books-canary
  namespace: svc-books
spec:
  selector:
    app.kubernetes.io/name: books
  ports:
    - name: http
      port: 80
      targetPort: http
