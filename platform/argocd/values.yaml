# Argo CD manages itself after `task up:local` installs it once with these same values (release name `argocd`).
configs:
  params:
    server.insecure: true            # reached via `kubectl port-forward` only; never exposed through the gateway
    # Diff through the API server, which matches the ServerSideApply sync option (defaulted fields and
    # admission mutations are seen as the server sees them). CVE-2026-45737 (ServerSideDiff) is fixed in 3.4.2+.
    controller.diff.server.side: "true"
  cm:
    timeout.reconciliation: 60s      # ADR-014: poll Git every minute (no inbound webhook into local clusters)
    application.resourceTrackingMethod: annotation
    # Controllers (Kyverno, CNPG, Envoy Gateway, ...) inject TLS caBundles into their CRD conversion webhooks and
    # webhook configurations at runtime. Ignore those fields so self-heal does not fight the controllers.
    resource.customizations.ignoreDifferences.apiextensions.k8s.io_CustomResourceDefinition: |
      jqPathExpressions:
        - .spec.conversion.webhook.clientConfig.caBundle
    resource.customizations.ignoreDifferences.admissionregistration.k8s.io_ValidatingWebhookConfiguration: |
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
    resource.customizations.ignoreDifferences.admissionregistration.k8s.io_MutatingWebhookConfiguration: |
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
dex:
  enabled: false
# DORA ledger (ADR-019): one GitHub Deployment on warden-gitops per service revision, environment = the
# Application name, final state success (Synced + Healthy) or failure (Degraded, e.g. an aborted canary).
# `warden dora` reads exactly this. Credentials: the warden-ccd-deployments GitHub App, loaded out of band into
# argocd-notifications-secret by warden-infra scripts/bootstrap_secrets.py; without it the controller only logs.
notifications:
  enabled: true
  secret:
    create: false                    # never in Git (CLAUDE.md rule 8)
  notifiers:
    service.github: |
      appID: $github-appID
      installationID: $github-installationID
      privateKey: $github-privateKey
  templates:
    template.warden-deployed: |
      github:
        deployment:
          state: success
          environment: "{{.app.metadata.name}}"
          requiredContexts: []
          autoMerge: false
          transientEnvironment: false
    template.warden-degraded: |
      github:
        deployment:
          state: failure
          environment: "{{.app.metadata.name}}"
          requiredContexts: []
          autoMerge: false
          transientEnvironment: false
  triggers:
    trigger.warden-deployed: |
      - when: app.status.operationState != nil and app.status.operationState.phase in ['Succeeded'] and app.status.health.status == 'Healthy'
        oncePer: app.status.operationState.syncResult.revision
        send: [warden-deployed]
    trigger.warden-degraded: |
      - when: app.status.health.status == 'Degraded'
        oncePer: app.status.sync.revision
        send: [warden-degraded]
