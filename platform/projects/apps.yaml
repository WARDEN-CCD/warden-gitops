# AppProject for service Applications (apps/*). A service directory can only deploy namespaced workload kinds
# into its own svc-* namespace, from this repo. No RBAC objects, no cluster-scoped kinds except its Namespace,
# which must be named svc-* (hub ADR-029): a service directory cannot relabel a platform namespace.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: apps
  namespace: argocd
spec:
  description: Warden services generated by `warden new`
  sourceRepos:
    - https://github.com/WARDEN-CCD/warden-gitops.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: "svc-*"
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
      name: "svc-*"
  namespaceResourceBlacklist:
    - group: rbac.authorization.k8s.io
      kind: Role
    - group: rbac.authorization.k8s.io
      kind: RoleBinding
    - group: ""
      kind: ResourceQuota
    - group: ""
      kind: LimitRange
